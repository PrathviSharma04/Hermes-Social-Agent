[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-social-agent"
version = "0.1.0"
description = "A 24/7, quality-first, self-improving social content agent for LinkedIn, Instagram, and X controlled through Telegram"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hermes Social Agent Team"}
]
keywords = ["hermes", "social-agent", "content", "automation", "telegram", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "litellm>=1.20.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "Pillow>=10.2.0",
    "gspread>=6.1.2",
    "google-auth>=2.27.0",
    "oauth2client>=4.1.3",
    "PyYAML>=6.0",
    "rich>=13.7.0",
    "python-telegram-bot>=21.0.1",
    "tweepy>=4.14.0",
    "scipy>=1.11.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
hermes-social = "hermes_social.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
